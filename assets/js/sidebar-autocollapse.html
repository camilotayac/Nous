<script>
document.addEventListener("DOMContentLoaded", function () {
  var sections = document.querySelectorAll("#quarto-sidebar .sidebar-section");
  if (!sections.length) return;

  var activeLink = document.querySelector("#quarto-sidebar .sidebar-link.active");
  if (!activeLink) return;

  var activeSection = activeLink.closest(".sidebar-section");

  // Defer to after first paint so page renders with all sections visible first
  requestAnimationFrame(function () {
    sections.forEach(function (section) {
      if (section !== activeSection) {
        var item = section.closest(".sidebar-item-section");
        if (item) {
          var toggle = item.querySelector(".sidebar-item-toggle");
          if (toggle) {
            try {
              var bsCollapse = new bootstrap.Collapse(section, { toggle: false });
              bsCollapse.hide();
            } catch (e) {
              section.classList.remove("show");
            }
            toggle.setAttribute("aria-expanded", "false");
          }
        }
      }
    });
  });
});
</script>
