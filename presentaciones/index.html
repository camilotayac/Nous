      margin: 40px auto;
      padding: 20px;

    h1 { color: #333; }

    }
    .presentation h2 { margin-top: 0; }
    .presentation a {

      background: #007bff;
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 4px;
      margin-right: 10px;
    }
    .presentation a:hover { background: #0056b3; }
    .presentation .pdf { background: #dc3545; }
    .presentation .pdf:hover { background: #c82333; }
